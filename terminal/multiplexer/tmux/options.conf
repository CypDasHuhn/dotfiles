set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 750
set -g mouse on

# Remove the legacy bootstrap session created by the shell wrappers. Keeping
# this cleanup hook makes old Resurrect save files self-healing as well.
set -g @resurrect-hook-post-restore-all 'tmux kill-session -t =__tmux_restore__ 2>/dev/null || true'

# Shell dispatcher: resolved at config-parse time via %if so that all
# keybindings and the status bar can reference #{@shell-cmd}/#{@script-ext}
# without per-bind conditionals.
%if "#{env:WINDIR}"
set -g @shell-cmd "nu"
set -g @script-ext ".nu"
%else
set -g @shell-cmd "bash"
set -g @script-ext ".sh"
%endif
