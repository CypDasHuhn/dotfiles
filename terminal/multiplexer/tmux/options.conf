set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
# Rename's reload doesn't re-apply the current-session filter, so the
# attached session pops back into the list as selectable right after a
# rename. Always showing it avoids the inconsistent "appears sometimes" UX.
set -g @sessionx-filter-current 'false'

# --- session persistence (resurrect must load before continuum) ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g mouse on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 750

# extended-keys is a server option; foot/kitty/xterm all speak xterm's
# modifyOtherKeys. The `extkeys` feature already supplies the correct
# Eneks=\E[>4;2m / Dseks=\E[>4m, so no terminal-overrides hackery is needed.
# NOTE: foot still can't fully disambiguate C-S-<letter> this way - see the
# uppercase aliases in keybindings.conf.
set -s extended-keys on
set -as terminal-features ',foot*:extkeys,xterm*:extkeys'
set-hook -gu session-created
set-hook -gu client-attached
