set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 750
set -g mouse on

# Remove the legacy bootstrap session created by the shell wrappers. Keeping
# this cleanup hook makes old Resurrect save files self-healing as well.
set -g @resurrect-hook-post-restore-all 'tmux kill-session -t =__tmux_restore__ 2>/dev/null || true'

# Shell dispatcher: all scripts are nushell, on every platform. Keybindings
# and the status bar reference #{@shell-cmd}/#{@script-ext} so no per-bind
# conditionals are needed.
set -g @shell-cmd "nu"
set -g @script-ext ".nu"

# Resurrect does not persist user options, so session groups are kept in a
# state file written on every mutation; replay it on each config load.
run-shell "#{@shell-cmd} ~/.config/tmux/scripts/groups-store#{@script-ext} load"
