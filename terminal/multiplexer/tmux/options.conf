set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 750
set -g mouse on
set -g set-clipboard on
set -g get-clipboard request
set -g allow-passthrough on
set -g focus-events on

# Shell dispatcher: all scripts are nushell, on every platform. Keybindings
# and the status bar reference #{@shell-cmd}/#{@script-ext} so no per-bind
# conditionals are needed.
set -g @shell-cmd "nu --no-config-file"
set -g @script-ext ".nu"

set -g @workspace-purposes "shell,editor,ai"
set -g @workspace-default-purpose "shell"
set -g @workspace-session-commit-delay "10"

set-hook -g session-created 'run-shell "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} session-created #{q:session_name}"'
set-hook -g after-select-window 'run-shell -b "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} after-select-window #{q:session_name} #{q:window_id}"'
set-hook -g after-new-window 'run-shell -b "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} after-new-window #{q:session_name} #{q:window_id}"'
set-hook -g client-attached 'run-shell "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} client-session-changed #{q:client_name}"'
set-hook -g client-session-changed 'run-shell "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} client-session-changed #{q:client_name}"'
run-shell "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} initialize-all"
