# --- unix only: terminal extended key protocols ---
set -s extended-keys on
set -as terminal-features ',foot*:extkeys,xterm*:extkeys'
set-hook -gu session-created
set-hook -gu client-attached

# --- plugins (managed by tpm) ---
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# sessionx popup (unix only — requires fzf + bash)
run-shell ~/.config/tmux/plugins/tmux-sessionx/sessionx.tmux
bind-key -n C-M-w run-shell "~/.config/tmux/plugins/tmux-sessionx/scripts/sessionx.sh"

run '~/.config/tmux/plugins/tpm/tpm'
