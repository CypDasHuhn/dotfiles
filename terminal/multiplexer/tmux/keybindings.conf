# --- Ctrl-Shift-<letter> uppercase aliases ---
# foot encodes Ctrl+Shift+l as CSI 27;6;76~ (the *shifted* keysym, capital L),
# which tmux sees as the key `C-S-L`, not `C-S-l`. xterm/kitty use the unshifted
# keysym (108 -> `C-S-l`). Bind both spellings so the combos work in every
# terminal. See: foot input.c legacy_kbd_protocol (emits raw `sym`), tmux 3.6.
bind-key -n C-S-H if-shell -F "#{pane_at_left}" "run-shell '#{@shell-cmd} ~/.config/tmux/scripts/purpose#{@script-ext} cycle left #{q:client_session} #{q:client_name}'" "select-pane -L"
bind-key -n C-S-L if-shell -F "#{pane_at_right}" "run-shell '#{@shell-cmd} ~/.config/tmux/scripts/purpose#{@script-ext} cycle right #{q:client_session} #{q:client_name}'" "select-pane -R"
bind-key -n C-S-T run-shell "#{@shell-cmd} ~/.config/tmux/scripts/workspace#{@script-ext} new-window #{q:client_name}"
bind-key -n C-S-W kill-window
bind-key -n C-S-R command-prompt "rename-window '%%'"
bind-key -n C-S-P switch-client -T zellij-pane
bind-key -n C-S-X switch-client -T zellij-resize
bind-key -n C-S-M switch-client -T zellij-move
bind-key -n C-S-S run-shell "#{@shell-cmd} ~/.config/tmux/scripts/purpose#{@script-ext} select shell #{q:client_session}"
bind-key -n C-S-E run-shell "#{@shell-cmd} ~/.config/tmux/scripts/purpose#{@script-ext} select editor #{q:client_session}"
bind-key -n C-S-A run-shell "#{@shell-cmd} ~/.config/tmux/scripts/purpose#{@script-ext} select ai #{q:client_session}"
bind-key -n C-S-V copy-mode \; switch-client -T zellij-scroll
bind-key -n C-S-B switch-client -T zellij-tmux

