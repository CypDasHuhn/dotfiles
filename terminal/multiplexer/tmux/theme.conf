set -g status-position top
set -g status 3
set -g status-left ''
set -g status-right ''
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=#2f3045,fg=#ffffff"
set -g status-format[0] "#(#{@shell-cmd} ~/.config/tmux/scripts/status#{@script-ext} sessions #{q:client_session} #{q:client_name})#{E:status-right}"
set -g status-format[1] "#(#{@shell-cmd} ~/.config/tmux/scripts/status#{@script-ext} related #{q:client_session} #{q:client_name})#{E:status-right}"
set -g status-format[2] "#(#{@shell-cmd} ~/.config/tmux/scripts/status#{@script-ext} purposes #{q:client_session} #{q:window_id})#{E:status-right}"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bold,fg=#ffffff,bg=#5cb2ed"
setw -g window-status-style "fg=#ffffff,bg=#1a1b26"
setw -g window-status-separator " "
