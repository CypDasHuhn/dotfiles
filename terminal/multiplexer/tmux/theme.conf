set -g status-position top
# Two status lines: with status-position top, index 0 is the upper line.
# Keep sessions above the window tabs so they are distinct and easy to scan.
set -g status 2
set -g status-left ''
set -g status-right ''
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=#2f3045,fg=#ffffff"
set -g status-format[0] "#(bash ~/.config/tmux/scripts/session-status.sh #{q:client_session})"
set -g status-format[1] "#{W:#[#{E:window-status-style}]#{E:window-status-format}#[default]#{E:window-status-separator},#[#{E:window-status-current-style}]#{E:window-status-current-format}#[default]#{E:window-status-separator}}"

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bold,fg=#ffffff,bg=#5cb2ed"
setw -g window-status-style "fg=#ffffff,bg=#1a1b26"
setw -g window-status-separator " "
